# On every merge to main: the checks, the product page, then a release of the version in the TOC if it has none yet.
#
# - Publishes the product page (tools/site/build.ts: the README, the changelog, the releases' highlights and the
#   committed screenshots in site/media) on GitHub Pages, on every merge, released or not: Settings > Pages > Source
#   must be "GitHub Actions". It goes first: the release's notes show its pictures.
# - Builds OneMoreQuest-<version>.zip and SHA256SUMS.txt (tools/release/build-zip.ts).
# - Creates the GitHub release v<version>: its notes are the version's highlights (site/releases), its CHANGELOG.md
#   section, how to install and the
#   checksum (tools/release/notes.ts), then the merged pull requests (GitHub's generated notes). The zip and the
#   checksums are its downloads. A version with a "-" (1.2.3-beta1) is marked a pre-release.
# - Uploads the zip to CurseForge (tools/release/curseforge.ts) when it is set up: the secret CURSEFORGE_API_TOKEN
#   and the repository variables CURSEFORGE_PROJECT_ID and CURSEFORGE_GAME_VERSIONS (Settings > Secrets and
#   variables > Actions). Without the token the step is skipped. Its changelog opens with the version's highlights
#   and ends with a link to the version on the product page.
#
# A merge that does not raise the version releases nothing (its version has a release already): raise it in the pull
# request (bun run release:version patch: package.json's "version", written into the TOC) and write its CHANGELOG.md
# section to release it. Run by hand (Actions > Release >
# Run workflow) to retry a release that failed part way; what was done already is not done twice.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Upload to CurseForge even if the GitHub release exists already (it failed there before)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Release
    needs: [checks, site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
      CURSEFORGE_RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (the tags, for the generated notes since the last release)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # (the packageManager's Bun: the zip is the same bytes on every machine with it)

      - name: Build the zip
        id: build
        run: bun tools/release/build-zip.ts

      - name: Is this version released already?
        id: state
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "OneMoreQuest $VERSION has a release already: nothing new to release (raise the TOC's version to release)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release notes
        if: steps.state.outputs.exists == 'false'
        run: bun tools/release/notes.ts --out dist/release-notes.md

      - name: Create the GitHub release
        if: steps.state.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          CHECKSUMS: ${{ steps.build.outputs.checksums }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$VERSION" "$ZIP" "$CHECKSUMS" \
            --title "OneMoreQuest $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file dist/release-notes.md \
            --generate-notes \
            "${flags[@]}"
          {
            echo "Released [OneMoreQuest $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)"
            echo
            echo '```'
            cat "$CHECKSUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to CurseForge
        if: env.CURSEFORGE_API_TOKEN != '' && (steps.state.outputs.exists == 'false' || inputs.curseforge)
        env:
          ZIP: ${{ steps.build.outputs.zip }}
        run: bun tools/release/curseforge.ts --zip "$ZIP"

      - name: CurseForge is not set up
        if: env.CURSEFORGE_API_TOKEN == '' && steps.state.outputs.exists == 'false'
        run: |
          echo "::notice::Not uploaded to CurseForge: the secret CURSEFORGE_API_TOKEN is not set (see .github/workflows/release.yml)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OneMoreQuest-${{ steps.build.outputs.version }}
          path: dist/
          retention-days: 30

  site:
    name: Product page
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build the site
        run: bun tools/site/build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Publish it
        id: deploy
        uses: actions/deploy-pages@v4
